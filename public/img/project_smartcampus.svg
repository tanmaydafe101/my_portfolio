<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2347"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#132347"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1736" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame Wrapper -->
  <rect x="0" y="0" width="1200" height="750" fill="#070a0f" rx="16"/>

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="1200" height="54" fill="url(#chromeGrad)" rx="16"/>
  <rect x="0" y="38" width="1200" height="16" fill="url(#chromeGrad)"/>

  <!-- Window Controls -->
  <circle cx="28" cy="27" r="7" fill="#ef4444"/>
  <circle cx="50" cy="27" r="7" fill="#f59e0b"/>
  <circle cx="72" cy="27" r="7" fill="#10b981"/>

  <!-- Browser Address Bar -->
  <rect x="180" y="10" width="840" height="34" rx="8" fill="#070d1d" stroke="#1e293b" stroke-width="1"/>
  <!-- Lock Icon -->
  <path d="M204 22 v-3 a 5 5 0 0 1 10 0 v 3 h 1 a 2 2 0 0 1 2 2 v 6 a 2 2 0 0 1 -2 2 h -12 a 2 2 0 0 1 -2 -2 v -6 a 2 2 0 0 1 2 -2 z" fill="#10b981"/>
  <text x="226" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">https://smartcampus.site.je/?i=1</text>
  <!-- SSL Verified Badge -->
  <rect x="910" y="15" width="96" height="24" rx="12" fill="#065f46"/>
  <text x="922" y="31" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SSL SECURE</text>

  <!-- Main Website Canvas Body -->
  <g transform="translate(0, 54)">
    <!-- Hero Banner (Deep Navy Gradient) -->
    <rect x="0" y="0" width="1200" height="240" fill="url(#bgGrad)"/>
    
    <!-- Subtle Grid overlay -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M200 0 V240 M400 0 V240 M600 0 V240 M800 0 V240 M1000 0 V240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Live Status Pill -->
    <g transform="translate(500, 24)">
      <rect x="0" y="0" width="200" height="28" rx="14" fill="#10b981"/>
      <circle cx="18" cy="14" r="4" fill="#ffffff"/>
      <text x="32" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">● System Online &amp; Active</text>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="600" y="96" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Smart Campus Issue Management</text>
    <text x="600" y="132" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">A centralized digital portal for reporting, tracking, and resolving campus facility,</text>
    <text x="600" y="154" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Wi-Fi, classroom, and electrical problems in real-time.</text>

    <!-- Main Content Background (Light slate) -->
    <rect x="0" y="240" width="1200" height="456" fill="#f1f5f9"/>

    <!-- ================= CARD 1: Student Portal ================= -->
    <g transform="translate(140, 200)" filter="url(#cardShadow)">
      <!-- Card Body -->
      <rect x="0" y="0" width="420" height="390" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Icon Circle (Blue) -->
      <circle cx="210" cy="56" r="32" fill="#dbeafe"/>
      <!-- Mortarboard Icon -->
      <path d="M194 54 L210 44 L226 54 L210 64 Z" fill="#2563eb"/>
      <path d="M198 57.5 V67 C198 71 222 71 222 67 V57.5" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <path d="M226 55 V66" stroke="#2563eb" stroke-width="2"/>

      <!-- Title -->
      <text x="210" y="118" text-anchor="middle" fill="#0f2347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Student Portal</text>
      
      <!-- Description -->
      <text x="210" y="146" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Report issues with campus Wi-Fi, classroom</text>
      <text x="210" y="166" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">fans, projectors, and track resolution in real-time.</text>

      <!-- Primary Button: Student Sign In -->
      <rect x="40" y="196" width="340" height="46" rx="8" fill="#2563eb"/>
      <text x="210" y="225" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">➜ Student Sign In</text>

      <!-- Secondary Button: Register Account -->
      <rect x="40" y="252" width="340" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="210" y="276" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">New Student? Register Account</text>

      <!-- Demo Box -->
      <line x1="30" y1="306" x2="390" y2="306" stroke="#e2e8f0" stroke-width="1"/>
      <text x="40" y="328" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DEMO STUDENT ACCOUNT</text>
      <text x="40" y="348" fill="#0f2347" font-family="'Fragment Mono', monospace, Consolas" font-size="12" font-weight="600">ananya.student@campus.edu</text>
      <text x="40" y="368" fill="#64748b" font-family="'Fragment Mono', monospace, Consolas" font-size="11">Password: Student@123</text>
    </g>

    <!-- ================= CARD 2: Admin Dashboard ================= -->
    <g transform="translate(640, 200)" filter="url(#cardShadow)">
      <!-- Card Body -->
      <rect x="0" y="0" width="420" height="390" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Icon Circle (Amber) -->
      <circle cx="210" cy="56" r="32" fill="#fef3c7"/>
      <!-- Shield Lock Icon -->
      <path d="M210 42 L223 48 V58 C223 68 210 74 210 74 C210 74 197 68 197 58 V48 Z" fill="#d97706"/>
      <circle cx="210" cy="56" r="3" fill="#ffffff"/>

      <!-- Title -->
      <text x="210" y="118" text-anchor="middle" fill="#0f2347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Admin Dashboard</text>
      
      <!-- Description -->
      <text x="210" y="146" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Review complaints, assign technicians,</text>
      <text x="210" y="166" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">update workflow status &amp; export CSV reports.</text>

      <!-- Primary Button: Admin Sign In -->
      <rect x="40" y="196" width="340" height="46" rx="8" fill="#f59e0b"/>
      <text x="210" y="225" text-anchor="middle" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">⚙ Administrator Sign In</text>

      <!-- Secondary Button: Setup -->
      <rect x="40" y="252" width="340" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="210" y="276" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Admin Account Setup / Reset</text>

      <!-- Demo Box -->
      <line x1="30" y1="306" x2="390" y2="306" stroke="#e2e8f0" stroke-width="1"/>
      <text x="40" y="328" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DEMO ADMIN ACCOUNT</text>
      <text x="40" y="348" fill="#0f2347" font-family="'Fragment Mono', monospace, Consolas" font-size="12" font-weight="600">admin@campus.edu</text>
      <text x="40" y="368" fill="#64748b" font-family="'Fragment Mono', monospace, Consolas" font-size="11">Password: Admin@123</text>
    </g>

    <!-- Bottom Bar: Synchronized Native Android App -->
    <g transform="translate(140, 610)">
      <rect x="0" y="0" width="920" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="18" y="12" width="40" height="40" rx="20" fill="#e0f2fe"/>
      <!-- Mobile Phone SVG Icon -->
      <rect x="31" y="22" width="14" height="20" rx="3" fill="none" stroke="#0284c7" stroke-width="2"/>
      <circle cx="38" cy="38" r="1" fill="#0284c7"/>
      
      <text x="74" y="32" fill="#0f2347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Native Android Client Synchronized</text>
      <text x="74" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Directly connected to SmartCampus/android-app/ for real-time mobile push notifications.</text>
      
      <!-- Tech Badge -->
      <rect x="800" y="18" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="850" y="36" text-anchor="middle" fill="#0369a1" font-family="'Fragment Mono', monospace" font-size="12" font-weight="600">Java + XML</text>
    </g>
  </g>
</svg>
